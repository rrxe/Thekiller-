<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<title>ODDXS — لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0b0f17;--card:rgba(21,28,41,.94);--card2:#1a2333;--line:rgba(255,255,255,.08);--line2:#303b4d;--ink:#fff;--mut:#92a1b7;--acc:#40a7e3;--blue:#40a7e3;--win:#4caf50;--loss:#ff6b6b;--warn:#ffca57;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at top,#142238 0%,#0b0f17 45%) fixed;font-family:system-ui,-apple-system,"Segoe UI",Tajawal,"Noto Sans Arabic",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.ltr{direction:ltr;unicode-bidi:plaintext;text-align:left}.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}.hidden{display:none!important}
a{color:var(--acc);word-break:break-all}
/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login-box{width:min(100%,400px);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 10px 35px rgba(0,0,0,.25)}
.logo{font-weight:900;font-size:28px;letter-spacing:1px}.logo b{color:var(--acc)}.login-box p{color:var(--mut);margin:8px 0 16px}
/* inputs / buttons */
input,select,textarea{width:100%;background:#0f1520;border:1px solid var(--line2);border-radius:11px;padding:12px;outline:none;margin:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}textarea{min-height:96px;resize:vertical}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;background:var(--acc);color:#fff;transition:.15s}
.btn:hover{opacity:.92}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.soft{background:#273449;color:#e6eefb}.btn.red{background:#d32f2f}.btn.green{background:#388e3c}.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px}.btn.full{width:100%}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,15,23,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top .logo{font-size:18px;line-height:1}.ttl{flex:1;min-width:0}.ttl #pageTitle{color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(64,167,227,.12);border:1px solid rgba(64,167,227,.25);color:#b9dfff}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:#1a2333;font-size:18px;font-weight:800}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 90px}
/* page titles + help */
h1{font-size:22px;margin:0 0 6px;font-weight:800;color:var(--acc)}h2{font-size:16px;margin:0 0 12px;color:#e6eefb}h3{font-size:17px;margin:0 0 12px;color:var(--acc)}
.help{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:rgba(64,167,227,.08);border:1px solid rgba(64,167,227,.18);color:#c9e4f7;font-size:13px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;min-width:0;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat{margin:0;padding:12px;border-radius:14px;box-shadow:none;background:rgba(255,255,255,.04)}.stat span{display:block;color:var(--mut);font-size:12px}.stat b{display:block;font-size:22px;margin-top:4px}.stat small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.acc{color:var(--acc)}.loss{color:var(--loss)}.warn{color:var(--warn)}.win{color:var(--win)}
/* home */
.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;padding:14px 16px;margin-bottom:14px;border-radius:16px;border:1px solid rgba(255,202,87,.4);background:rgba(255,202,87,.1);color:#ffe3a1;font-size:14px}
.alert span{font-weight:800;white-space:nowrap}
.okbar{padding:12px 16px;margin-bottom:14px;border-radius:16px;border:1px solid rgba(76,175,80,.25);background:rgba(76,175,80,.08);color:#a5e0ab}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sbox{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}.sbox .sv{font-size:24px;font-weight:800}.sbox .sl{color:var(--mut);font-size:12px;margin-top:2px}
.group{margin:18px 2px 8px;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.04em}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;text-align:start;background:#1a2333;border:1px solid var(--line2);border-radius:16px;color:#e6eefb;min-height:96px}
.nav-btn:active{transform:scale(.98)}.nav-btn .ic{font-size:26px;line-height:1}.nav-btn b{font-size:14px}.nav-btn small{color:var(--mut);font-size:11.5px;line-height:1.35}
.nav-btn .badge{position:absolute;top:10px;inset-inline-end:10px;background:#e53935;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px}
/* lists */
.li{display:block;padding:12px;margin-bottom:8px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.li.click{cursor:pointer}.li.click:active{background:rgba(64,167,227,.1)}
.li .l1{display:flex;align-items:center;justify-content:space-between;gap:8px}.li .l2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--mut);font-size:12px}.li strong{font-size:15px}.li small{color:var(--mut)}
.av{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(64,167,227,.16);color:var(--acc);font-weight:800}
.urow{display:flex;align-items:center;gap:10px}.urow .ui{flex:1;min-width:0}.urow .ui>*{display:block}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#273449;color:#cfd9e8}
.tag.paid,.tag.win{background:rgba(76,175,80,.15);color:#8be59a}.tag.rejected,.tag.lose{background:rgba(229,57,53,.14);color:#ff9999}.tag.pending,.tag.open{background:rgba(255,202,87,.15);color:#ffd77a}.tag.gram{background:rgba(64,167,227,.15);color:#9fd4f5}.tag.binance{background:rgba(255,202,87,.12);color:#ffd77a}
/* withdrawals */
.wd{display:block;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035)}
.wd>div{margin-bottom:10px}.wd>div:last-child{margin:0}.wd small{display:block;color:var(--mut);margin-top:3px;font-size:12px}
.wd .row{margin-top:4px}.wd .row .btn{flex:1;padding:12px}
.copy{background:#273449;border:0;border-radius:8px;padding:5px 10px;font-size:11px;color:#e6eefb;margin-top:6px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;color:#b9dfff}
/* misc */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}.row>input,.row>select{flex:1;min-width:130px;max-width:none!important;width:auto}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.f label{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}
.sw{display:flex;align-items:center;gap:8px;background:#0f1520;border:1px solid var(--line2);border-radius:11px;padding:11px 12px;color:#e6eefb}.sw input{width:auto}
details.fold{padding:0}details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;font-size:15px;color:#e6eefb;display:flex;align-items:center;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}details.fold>summary::after{content:"＋";color:var(--acc);font-size:18px}details.fold[open]>summary::after{content:"－"}
details.fold>.inner{padding:0 16px 16px}
.savebar{position:sticky;bottom:12px;z-index:10;margin-top:6px}.savebar .btn{width:100%;padding:14px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-top:1px solid var(--line);text-align:start;font-size:12px;vertical-align:middle}th{color:var(--mut);font-weight:700;font-size:11px;border-top:0}.tw{overflow:auto}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}.bars div.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}.bars .b{display:flex;gap:3px;align-items:flex-end;height:100px;width:100%;justify-content:center}.bars i{display:block;width:38%;border-radius:3px 3px 0 0;min-height:2px}.bars small{color:var(--mut);font-size:10px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.modal .box{background:#121a27;border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:18px;width:min(100%,760px);max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a2333;border:1px solid var(--acc);border-radius:12px;padding:12px 18px;z-index:99;font-weight:700}.toast.err{border-color:var(--loss);color:#ffb3b3}
.empty{color:var(--mut);text-align:center;padding:26px}.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;color:var(--mut)}
.section-anim{animation:fi .18s ease}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}

/* [ref-admin-v1] referrals */
.rf-hero{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.rf-box{padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.rf-box .v{font-size:26px;font-weight:800;line-height:1.1}.rf-box .l{color:var(--mut);font-size:12px;margin-top:4px}
.rf-box.a{background:linear-gradient(135deg,rgba(64,167,227,.18),rgba(64,167,227,.04));border-color:rgba(64,167,227,.3)}
.rf-box.b{background:linear-gradient(135deg,rgba(255,202,87,.16),rgba(255,202,87,.03));border-color:rgba(255,202,87,.3)}
.rf-box.c{background:linear-gradient(135deg,rgba(76,175,80,.17),rgba(76,175,80,.03));border-color:rgba(76,175,80,.3)}
.rf-box.d{background:linear-gradient(135deg,rgba(171,130,255,.17),rgba(171,130,255,.03));border-color:rgba(171,130,255,.3)}
.rf-funnel{margin-top:10px}.rf-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.rf-bar i{display:block;height:100%}.rf-bar .j{background:var(--acc)}.rf-bar .p{background:var(--warn)}.rf-bar .q{background:var(--win)}
.rf-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:11.5px;color:var(--mut)}
.rf-legend b{color:#fff}.rf-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.rf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rf-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:#222d40;color:#cfd9e8}
.rf-chip.j{background:rgba(64,167,227,.15);color:#9fd4f5}.rf-chip.p{background:rgba(255,202,87,.15);color:#ffd77a}.rf-chip.q{background:rgba(76,175,80,.15);color:#8be59a}.rf-chip.m{background:rgba(171,130,255,.15);color:#cdb7ff}
.rf-rank{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:10px;background:#222d40;color:#cfd9e8;font-weight:800;font-size:12px}
.rf-rank.t1{background:rgba(255,202,87,.2);color:#ffd77a}.rf-rank.t2{background:rgba(190,200,215,.18);color:#dfe6f0}.rf-rank.t3{background:rgba(205,127,50,.2);color:#e6a266}
.rf-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.rf-row:first-child{border-top:0}
.rf-row .m{flex:1;min-width:0}.rf-row .m strong{display:block;font-size:14px}.rf-row .m small{display:block;color:var(--mut);font-size:11.5px}
.rf-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.rf-pill.s0{background:#273449;color:#b8c4d6}.rf-pill.s1{background:rgba(255,202,87,.16);color:#ffd77a}.rf-pill.s2{background:rgba(76,175,80,.17);color:#8be59a}
.rf-tabs{display:flex;gap:8px;margin:12px 0 4px}.rf-tab{flex:1;padding:9px 6px;border-radius:11px;border:1px solid var(--line2);background:#1a2333;color:#cfd9e8;font-weight:800;font-size:12.5px}
.rf-tab.on{background:rgba(64,167,227,.18);border-color:var(--acc);color:#fff}
.rf-note{margin-top:10px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.04);color:var(--mut);font-size:12px}
@media(max-width:560px){.rf-box .v{font-size:22px}}
</style>
</head>
<body>
<div id="login">
  <form class="login-box" id="loginForm">
    <div class="logo">ODD<b>X</b>S</div>
    <p>لوحة تحكم ODDXS — أدخل كلمة سر الإدارة (ADMIN_SECRET) للدخول</p>
    <input id="secret" type="password" class="ltr" placeholder="ADMIN_SECRET" autocomplete="current-password" />
    <button class="btn full" style="margin-top:12px">دخول</button>
    <div id="loginErr" class="loss" style="margin-top:10px;font-size:13px"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <button class="back hidden" id="backBtn" aria-label="رجوع" onclick="go('home')">→</button>
    <div class="ttl"><div class="logo">ODD<b>X</b>S</div><div id="pageTitle">الرئيسية</div></div>
    <span class="pill" id="meRole"></span>
    <button class="btn soft sm" id="refreshBtn" aria-label="تحديث">↻</button>
    <button class="btn soft sm" id="logoutBtn">خروج</button>
  </header>
  <main class="wrap" id="main"></main>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pts = (cp) => (Number(cp || 0) / 100).toLocaleString('en', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
const dt = (s) => s ? new Date(s).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' }) : '—';
let PPU = 5000, ME = null, tab = 'dash', SECRET = '';
const usd = (cp) => '$' + (Number(cp || 0) / 100 / PPU).toFixed(3);
const who = (r) => `${esc(r.first_name || '')} ${r.username ? '<span class="ltr acc">@' + esc(r.username) + '</span>' : ''}<small class="ltr">${esc(r.telegram_id)}</small>`;

function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
async function api(action, body = {}) {
  const headers = { 'content-type': 'application/json', 'x-admin-secret': SECRET };
  const tg = window.Telegram?.WebApp?.initData; if (tg) headers['x-telegram-init-data'] = tg;
  const r = await fetch('/api/admin', { method: 'POST', headers, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}
const guard = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message, true); } };
function modal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('click', (e) => { const c = e.target.closest('[data-copy]'); if (c) { navigator.clipboard?.writeText(c.dataset.copy); toast('تم النسخ ✓'); } });

/* ───────── login ───────── */
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); SECRET = $('#secret').value.trim(); $('#loginErr').textContent = '';
  try { const j = await api('stats'); ME = j.me; sessionStorage.setItem('oddxs_admin', SECRET); start(j); }
  catch (err) { $('#loginErr').textContent = err.message; SECRET = ''; }
});
$('#logoutBtn').onclick = () => { sessionStorage.removeItem('oddxs_admin'); location.reload(); };
$('#refreshBtn').onclick = () => render();
(async () => { SECRET = sessionStorage.getItem('oddxs_admin') || ''; if (SECRET || window.Telegram?.WebApp?.initData) { try { const j = await api('stats'); ME = j.me; start(j); } catch { /* show login */ } } })();

const SECTIONS = [
  ['الأساسية', [
    ['wd', '💸', 'طلبات السحب', 'راجع طلبات السحب وادفع أو ارفض', 'withdrawals'],
    ['users', '👥', 'اللاعبون', 'ابحث عن لاعب، عدّل رصيده أو احظره', 'users'],
    ['referrals', '🔗', 'الإحالات', 'كم دعا كل لاعب، كم دخل، وكم لعب', 'users'],
    ['tasks', '✅', 'المهام', 'أضف مهام قنوات أو روابط وعدّلها', 'tasks'],
    ['dash', '📊', 'الإحصائيات', 'أرباحك، الأرصدة، الألعاب، آخر 7 أيام', 'dashboard']]],
  ['الإعدادات والتواصل', [
    ['settings', '⚙️', 'الإعدادات', 'المكافآت، حدود السحب، تشغيل الألعاب', 'settings'],
    ['force', '🔒', 'الاشتراك الإجباري', 'قنوات لازم اللاعب يشترك بيها', 'settings'],
    ['bc', '📣', 'رسالة جماعية', 'ارسل رسالة لكل اللاعبين', 'broadcast']]],
  ['متقدم', [
    ['rounds', '🎲', 'سجل الألعاب', 'كل رهان لعبه اللاعبون', 'rounds'],
    ['ledger', '📒', 'السجل المالي', 'كل حركة نقاط (دخول وخروج)', 'ledger'],
    ['audit', '🧾', 'سجل العمليات', 'شنو سوّت الإدارة ومتى', 'audit'],
    ['admins', '🛡️', 'المشرفون', 'أضف مشرفين وحدد صلاحياتهم', 'moderators']]],
];
const TITLE = { home: 'الرئيسية', dash: 'الإحصائيات' }; SECTIONS.forEach(([, a]) => a.forEach((t) => (TITLE[t[0]] = t[2])));
const HELP = {
  wd: 'هنا طلبات سحب اللاعبين. «معلّقة» = تنتظر قرارك. حوّل المبلغ للعنوان الظاهر ثم اضغط «تم الدفع»، أو اضغط «رفض» وترجع النقاط للاعب تلقائياً.',
  users: 'اضغط على أي لاعب لترى تفاصيله، تعدّل رصيده، أو تحظره.',
  referrals: 'ترتيب اللاعبين حسب عدد اللي دخلوا برابطهم. لكل داعي: كم دخل، كم لعب، كم أكمل الشرط. اضغط على أي داعي لترى كل مدعو وحالته.',
  tasks: 'المهام اللي تظهر للاعبين مقابل نقاط. استخدم الزر «إضافة مهمة جديدة» لإضافة مهمة.',
  rounds: 'سجل كل جولة لُعبت (رهان واحد = جولة). للمراجعة فقط.',
  ledger: 'كل حركة تغيّر رصيد اللاعبين: الأخضر = دخل له، الأحمر = خرج منه.',
  force: 'اللاعب ما يقدر يلعب أو يسحب قبل ما يشترك بالقنوات الفعّالة هنا. لازم البوت يكون مشرف بالقناة.',
  settings: 'كل إعدادات التطبيق. غيّر ما تريد ثم اضغط «حفظ الإعدادات» بالأسفل.',
  admins: 'المشرفون يدخلون عن طريق تلغرام ويشوفون فقط الأقسام اللي تعطيهم صلاحيتها.',
  bc: 'الرسالة توصل لكل مستخدمي البوت. تأكد من النص قبل الإرسال.',
  audit: 'سجل بكل إجراء نفّذته الإدارة (دفع، رفض، حظر، تعديل رصيد...).',

  <div class="row" style="margin:10px 0"><input id="adjp" type="number" step="any" placeholder="± نقاط" style="max-width:120px"/><input id="adjn" placeholder="سبب" style="max-width:200px"/><button class="btn green sm" onclick="doAdjust('${u.telegram_id}')">تعديل الرصيد</button>
    <input id="banr" placeholder="سبب الحظر" style="max-width:180px"/><button class="btn ${u.is_banned ? 'green' : 'red'} sm" onclick="doBan('${u.telegram_id}',${!u.is_banned})">${u.is_banned ? 'فك الحظر' : 'حظر'}</button></div>

  ${(() => { const rs = j.referral_stats || {}; const list = j.referrals || []; const f = (window.__rfF || 'all');
    const shown = list.filter((x) => f === 'all' || (f === 'paid' && x.referral_paid) || (f === 'played' && Number(x.rounds_played) > 0) || (f === 'idle' && !x.referral_paid && !Number(x.rounds_played)));
    return `<h2 id="rfSec" style="margin-top:14px">👥 الإحالات</h2>
    ${j.referrer ? `<div class="rf-note" style="margin:0 0 8px">جاء عن طريق: <b>${esc(j.referrer.first_name || '')}</b> <span class="ltr acc">${j.referrer.username ? '@' + esc(j.referrer.username) : ''}</span> <span class="ltr">${esc(j.referrer.telegram_id)}</span> <button class="btn soft sm" onclick="userDetail('${esc(j.referrer.telegram_id)}','ref')">فتح</button></div>` : ''}
    <div class="grid g2" style="margin-bottom:8px"><div class="rf-box a"><div class="v num">${nf(rs.total)}</div><div class="l">دخلوا برابطه</div></div><div class="rf-box b"><div class="v num">${nf(rs.played)}</div><div class="l">لعبوا جولة</div></div><div class="rf-box c"><div class="v num">${nf(rs.paid)}</div><div class="l">أكملوا الشرط</div></div><div class="rf-box d"><div class="v num">${pts(rs.earned_cp)}</div><div class="l">كسب من الإحالات</div></div></div>
    ${rfFunnel(rs.total, rs.played, rs.paid)}
    <div class="rf-chips"><span class="rf-chip m">🔁 جولات المدعوين <b class="num">${nf(rs.rounds)}</b></span><span class="rf-chip">💰 رهانات المدعوين <b class="num">${pts(rs.wagered_cp)}</b></span></div>
    <div class="rf-tabs">${[['all', 'الكل ' + list.length], ['paid', '✅ أكملوا'], ['played', '🎲 لعبوا'], ['idle', '👤 دخلوا فقط']].map(([k, l]) => `<button class="rf-tab ${f === k ? 'on' : ''}" onclick="window.__rfF='${k}';userDetail('${esc(u.telegram_id)}','ref')">${l}</button>`).join('')}</div>
    <div class="card" style="margin-top:8px;padding:6px 14px">${shown.map((x) => `<div class="rf-row click" style="cursor:pointer" onclick="userDetail('${esc(x.telegram_id)}')"><span class="av">${esc(Array.from(x.first_name || x.username || '?')[0] || '?').toUpperCase()}</span><div class="m"><strong>${esc(x.first_name || '—')} ${x.is_banned ? '<span class="tag lose">محظور</span>' : ''}</strong><small class="ltr">${x.username ? '@' + esc(x.username) + ' · ' : ''}${esc(x.telegram_id)} · دخل ${dt(x.created_at)}</small><small>🎲 جولات: <b class="num">${nf(x.rounds_played)}</b> · 📺 إعلانات: <b class="num">${nf(x.ads_total)}</b> · ✅ مهام: <b class="num">${nf(x.tasks_done)}</b> · رهانات: <b class="num">${pts(x.total_wagered_cp)}</b></small></div>${rfStatus(x)}</div>`).join('') || '<div class="empty">لا يوجد</div>'}</div>
    ${rs.total > list.length ? `<div class="rf-note">معروض آخر ${list.length} من ${rs.total}</div>` : ''}`; })()}
  <h2 style="margin-top:14px">آخر الحركات المالية</h2><div class="tw"><table>${j.ledger.slice(0, 12).map((l) => `<tr><td>${dt(l.created_at)}</td><td>${esc(l.kind)}</td><td class="num ${l.delta_cp >= 0 ? 'acc' : 'loss'}">${pts(l.delta_cp)}</td><td class="num">${pts(l.balance_after_cp)}</td></tr>`).join('')}</table></div>
  <h2 style="margin-top:12px">آخر الجولات</h2><div class="tw"><table>${j.rounds.slice(0, 10).map((r) => `<tr><td>${dt(r.created_at)}</td><td>${esc(r.game)}</td><td class="num">${pts(r.stake_cp)}</td><td class="num ${r.payout_cp > r.stake_cp ? 'acc' : 'loss'}">${pts(r.payout_cp)}</td><td>${r.status}</td></tr>`).join('') || '<tr><td class="empty">—</td></tr>'}</table></div>
  <h2 style="margin-top:12px">سحوباته</h2><div class="tw"><table>${j.withdrawals.map((w) => `<tr><td>${dt(w.created_at)}</td><td>${w.method}</td><td class="num">${pts(w.amount_cp)}</td><td class="code ltr">${esc(w.target)}</td><td><span class="tag ${w.status}">${w.status}</span></td></tr>`).join('') || '<tr><td class="empty">—</td></tr>'}</table></div>`);
  if (focus === 'ref') { const el = document.getElementById('rfSec'); if (el) el.scrollIntoView({ block: 'start' }); }
});
window.doAdjust = guard(async (id) => { const d = Number($('#adjp').value); if (!d) return toast('أدخل مبلغاً', true); await api('adjust_balance', { telegramId: id, deltaPts: d, note: $('#adjn').value }); toast('تم ✓'); userDetail(id); });
window.doBan = guard(async (id, banned) => { await api('ban_user', { telegramId: id, banned, reason: $('#banr').value }); toast('تم ✓'); userDetail(id); });
</script>
</body>
</html>
